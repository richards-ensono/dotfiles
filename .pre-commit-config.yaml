---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: chezmoi-template-check
        name: Check chezmoi templates
        # Render the complete source using an isolated config/destination,
        # rather than accidentally resolving includes from the user's source.
        entry: node scripts/ansible/tests/test-render.cjs
        language: system
        files: \.tmpl$
        pass_filenames: false
