---
- name: Check if uv is already installed
  ansible.builtin.command: "{{ uv_install_dir }}/uv --version"
  register: uv_check
  failed_when: false
  changed_when: false

- name: Create temporary directory for uv download
  ansible.builtin.tempfile:
    state: directory
    suffix: uv_download
  register: uv_temp_dir
  when: uv_check.rc != 0 or uv_version not in uv_check.stdout

- name: Ensure uv install directory exists
  ansible.builtin.file:
    path: "{{ uv_install_dir }}"
    state: directory
    mode: "0755"
  when: uv_check.rc != 0 or uv_version not in uv_check.stdout

- name: Download uv tarball
  ansible.builtin.get_url:
    url: "{{ uv_download_url }}"
    dest: "{{ uv_temp_dir.path }}/uv.tar.gz"
    checksum: "{{ uv_checksum }}"
    mode: "0644"
  when: uv_check.rc != 0 or uv_version not in uv_check.stdout

- name: Extract uv tarball
  ansible.builtin.unarchive:
    src: "{{ uv_temp_dir.path }}/uv.tar.gz"
    dest: "{{ uv_temp_dir.path }}"
    remote_src: true
  when: uv_check.rc != 0 or uv_version not in uv_check.stdout

- name: Install uv binary
  ansible.builtin.copy:
    src: "{{ uv_temp_dir.path }}/uv-{{ uv_platform }}/uv"
    dest: "{{ uv_install_dir }}/uv"
    mode: "0755"
  when: uv_check.rc != 0 or uv_version not in uv_check.stdout

- name: Install uvx binary
  ansible.builtin.copy:
    src: "{{ uv_temp_dir.path }}/uv-{{ uv_platform }}/uvx"
    dest: "{{ uv_install_dir }}/uvx"
    mode: "0755"
  when: uv_check.rc != 0 or uv_version not in uv_check.stdout

- name: Verify uv installation
  ansible.builtin.command: "{{ uv_install_dir }}/uv --version"
  register: uv_verify
  changed_when: false

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ uv_temp_dir.path }}"
    state: absent
  when: uv_temp_dir.path is defined

- name: Show uv version
  ansible.builtin.debug:
    msg: "uv installed: {{ uv_verify.stdout }}"

- name: Get installed uv tools
  ansible.builtin.command: "{{ uv_install_dir }}/uv tool list"
  register: uv_installed_tools
  changed_when: false
  failed_when: false

- name: Install uv tools
  ansible.builtin.command: "{{ uv_install_dir }}/uv tool install {{ item }}"
  loop: "{{ uv_tools | default([]) }}"
  register: uv_tool_install_result
  changed_when: uv_tool_install_result.rc == 0
  when:
    - uv_tools is defined
    - >-
      (
        uv_installed_tools.stdout_lines | default([])
      ) | select('match', '^' ~ item ~ ' ') | list | length == 0
