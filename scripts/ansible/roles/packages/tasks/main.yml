---
- name: Install specified packages
  ansible.builtin.package:
    name: "{{ packages_managed_packages }}"
    state: present
  when: packages_managed_packages | length > 0

- name: Check for fdfind binary
  ansible.builtin.stat:
    path: /usr/bin/fdfind
  register: packages_fd_find_binary_stat

- name: Ensure fd compatibility symlink on Debian
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  when: ansible_facts['os_family'] == "Debian"

- name: Install unlisted packages from .deb files (Debian)
  ansible.builtin.package:
    deb: "{{ item.source }}"
  when:
    - packages_unlisted_packages is defined
    - ansible_facts['os_family'] == "Debian"
  loop: "{{ packages_unlisted_packages }}"
