---
- name: Check supported .NET SDK architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in dotnet_arch_map
    fail_msg: >-
      No verified .NET {{ dotnet_sdk_version }} Linux asset is configured for
      {{ ansible_architecture }}.

- name: Check if exact .NET SDK is active
  ansible.builtin.command:
    argv: ["{{ dotnet_install_dir }}/dotnet", --version]
    chdir: "{{ dotnet_install_dir | dirname }}"
  register: dotnet_check
  failed_when: false
  changed_when: false

- name: Stage and install exact .NET SDK
  ansible.builtin.include_tasks: install-staged.yml
  when: dotnet_check.rc != 0 or (dotnet_check.stdout | trim) != dotnet_sdk_version

- name: Verify .NET installation
  ansible.builtin.command:
    argv: ["{{ dotnet_install_dir }}/dotnet", --version]
    chdir: "{{ dotnet_install_dir }}"
  register: dotnet_verify
  changed_when: false
  failed_when: dotnet_verify.rc != 0 or (dotnet_verify.stdout | trim) != dotnet_sdk_version

- name: Show .NET version
  ansible.builtin.debug:
    msg: ".NET installed: {{ dotnet_verify.stdout }}"
