---
- name: Check if systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: rootless_networking_systemd_check

- name: Set systemd availability fact
  ansible.builtin.set_fact:
    rootless_networking_systemd_available: "{{ rootless_networking_systemd_check.stat.exists }}"

- name: Skip role if systemd is not available
  ansible.builtin.debug:
    msg: "Skipping rootless-networking role - systemd is not available (container environment)"
  when: not rootless_networking_systemd_available

- name: Ensure required dependencies are installed (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - passt
      - slirp4netns
      - dbus-user-session
    state: present
  when:
    - rootless_networking_systemd_available
    - ansible_facts['os_family'] == 'Debian'
  become: true

- name: Ensure required dependencies are installed (CentOS)
  ansible.builtin.dnf:
    name:
      - passt
      - slirp4netns
    state: present
  when:
    - rootless_networking_systemd_available
    - ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Get current username if not available in environment
  ansible.builtin.command: whoami
  register: rootless_networking_whoami_result
  changed_when: false
  when:
    - rootless_networking_systemd_available
    - ansible_facts['env'].USER is not defined and ansible_facts['env'].SUDO_USER is not defined

- name: Set facts for the real user and UID
  ansible.builtin.set_fact:
    rootless_networking_real_user: >-
      {{ ansible_facts['env'].SUDO_USER | default(ansible_facts['env'].USER) |
      default(rootless_networking_whoami_result.stdout | default('root')) }}
  when: rootless_networking_systemd_available

- name: Get real user UID
  ansible.builtin.command: "id -u {{ rootless_networking_real_user }}"
  register: rootless_networking_user_uid_result
  changed_when: false
  when: rootless_networking_systemd_available

- name: Set real user UID fact
  ansible.builtin.set_fact:
    rootless_networking_real_user_uid: "{{ rootless_networking_user_uid_result.stdout }}"
  when: rootless_networking_systemd_available

- name: Set the systemd runtime directory
  ansible.builtin.set_fact:
    rootless_networking_xdg_runtime_dir: "/run/user/{{ rootless_networking_real_user_uid }}"
  when: rootless_networking_systemd_available

- name: Write Debug Variables
  ansible.builtin.debug:
    msg:
      - "Real User: {{ rootless_networking_real_user }}"
      - "Real User UID: {{ rootless_networking_real_user_uid }}"
      - "XDG Runtime Dir: {{ rootless_networking_xdg_runtime_dir }}"
  when: rootless_networking_systemd_available

- name: Enable and start podman.socket for {{ rootless_networking_real_user }}
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  environment:
    XDG_RUNTIME_DIR: "{{ rootless_networking_xdg_runtime_dir }}"
  when: rootless_networking_systemd_available

- name: Check podman socket responds with OK
  ansible.builtin.uri:
    url: http://localhost/_ping
    unix_socket: "/run/user/{{ rootless_networking_real_user_uid }}/podman/podman.sock"
    headers:
      content-type: application/json
    return_content: true
    status_code: 200
  register: rootless_networking_podman_ping
  changed_when: false
  when: rootless_networking_systemd_available

- name: Fail if podman socket does not respond with OK
  ansible.builtin.fail:
    msg: "Podman socket did not respond with OK: {{ rootless_networking_podman_ping.content | default('') }}"
  when:
    - rootless_networking_systemd_available
    - rootless_networking_podman_ping.content | trim != 'OK'
