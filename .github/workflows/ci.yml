---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install system linters
        env:
          CHEZMOI_VERSION: "2.72.1"
          CHEZMOI_SHA256: "168063d2bbde78522751b27d0c523d41c612640c5b568d156d20a50240c827ba"
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          curl --fail --location --silent --show-error \
            --output chezmoi.deb \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.deb"
          echo "${CHEZMOI_SHA256}  chezmoi.deb" | sha256sum --check --strict
          sudo dpkg --install chezmoi.deb
          rm chezmoi.deb

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.2

      - name: Run configured checks
        run: pre-commit run --all-files --show-diff-on-failure

  ansible:
    name: Ansible validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible tooling
        run: |
          python -m pip install --disable-pip-version-check \
            ansible==14.3.1 \
            ansible-lint==26.8.0

      - name: Install Ansible Galaxy requirements
        working-directory: scripts/ansible
        run: ansible-galaxy install -r requirements.yml

      - name: Check playbook syntax
        working-directory: scripts/ansible
        run: ansible-playbook playbook.yml -i inventory/hosts.yml --syntax-check

      - name: Lint Podman role
        working-directory: scripts/ansible
        run: ansible-lint roles/podman

      - name: Run focused Podman provisioning checks
        working-directory: scripts/ansible
        run: python3 tests/validate_podman_network_helpers.py
